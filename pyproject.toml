[project]
name = "teep"
version = "0.1.0"
description = "Extract chapters from ebooks"
readme = "README.md"
authors = [
    { name = "Eric Schiltz" },
    { name = "Arthur Amalvy", email = "arthur.amalvy@aethor.org" },
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "natsort>=8.4.0",
    "nltk>=3.10.3",
]

[project.scripts]
teep = "teep:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
